name: Aggiornamento Automatico Dati MASE

on:
  schedule:
    # ⚠️ I cron GitHub sono SEMPRE in UTC e "best effort": i run possono
    # partire con ritardi da minuti a ore. Per questo la finestra è ampia.

    # 🎯 1. Finestra Clou Martedì (ogni 15 min, minuti scaglionati anti-congestione):
    # Ore 08-12 UTC = 09:08-13:53 ora solare (CET) / 10:08-14:53 ora legale (CEST)
    # Parte presto perché il MASE spesso pubblica già prima di mezzogiorno.
    - cron: '8,23,38,53 8,9,10,11,12 * * 2'

    # 🕒 2. Monitoraggio pomeridiano di recupero (se MASE pubblica in ritardo):
    # Ore 14:18 e 16:18 UTC (= 16:18 e 18:18 CEST / 15:18 e 17:18 CET)
    - cron: '18 14,16 * * 2'

    # 🛡️ 3. Safety Fallback: mercoledì mattina se martedì era festivo
    # Ore 07:18 e 08:18 UTC (= 09:18 e 10:18 CEST / 08:18 e 09:18 CET)
    - cron: '18 7,8 * * 3'

  # Consente l'avvio manuale immediato con 1 click
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mase-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 🐍 Configura Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: ⚡ Esegui lo script di download MASE
        run: |
          python fetch_data.py

      - name: 💾 Salva i dati se modificati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aggiunge il file all'area di staging se modificato
          git add src/data/gasolio_mase.json
          
          # Verifica in modo pulito se ci sono modifiche effettive
          if git diff --staged --quiet; then
            echo "ℹ️ Nessun nuovo dato ministeriale rilevato: database già allineato."
          else
            git commit -m "chore(data): aggiornamento automatico prezzi gasolio MASE"
            git pull --rebase origin main
            git push origin main
            echo "✅ Nuovi dati MASE registrati e inviati con successo!"
          fi
